[workspace]
resolver = "2"
members = ["crates/fs-text", "crates/fs-wiki-core", "crates/fs-wiki-server", "crates/fs-wiki-client", "crates/fs-wiki-testserver", "crates/fs-wiki-app"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.2.0"

# Window resize crash (wgpu validation error when the window is enlarged): compositor cache sized by the window,
# not by the target texture. Pinned to a commit (coding.md section 8).
[patch.crates-io]
blinc_app = { git = "https://github.com/FreeSynergy/blinc-app-fix", rev = "1c5d217c3b07872b1de8c7959fe44f07b344783c" }

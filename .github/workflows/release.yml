name: release
on:
  push: { tags: ["v*"] }
permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write
jobs:
  release:
    uses: FreeSynergy/fs-release/.github/workflows/release.yml@main
    with:
      binaries: fs-wiki
      cargo-package: fs-wiki
      ignore-binaries: fs-wiki-app,fs-wiki-server   # the window and the server alone; `fs-wiki` holds both
      name: fs-wiki
      kind: app
      app-id: net.freesynergy.Wiki
      macos: false
      windows-targets: ""   # Unix sockets and Unix paths for now
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

# Copy to <repo>/.github/workflows/check.yml - runs fmt, clippy (pedantic), tests and the coding rules on every push.
name: check
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: FreeSynergy/fs-release/.github/workflows/check.yml@v0.0.6
    with:
      # Software Vulkan (lavapipe) and fonts for the tests that start the program and draw a picture; a runner has no GPU
      software-gpu: true

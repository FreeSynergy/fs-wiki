[package]
name = "fs-wiki"
description = "FreeSynergy.Wiki: texts and pages, with history, trash, folders and search. Without arguments the window opens; `serve` runs the server."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "fs-wiki"
path = "src/main.rs"

[features]
default = ["gui"]
# The window (Blinc). Without it the binary has the server only: `cargo build --no-default-features`.
gui = ["dep:fs-wiki-app"]
# Only for the typing test, in a debug build (see fs-wiki-app): the window writes the text of its fields to
# FS_TEST_ACCESS_FILE. Never in a release.
test-access = ["gui", "fs-wiki-app/test-access"]

[dependencies]
fs-wiki-server = { path = "../fs-wiki-server" }
fs-wiki-app = { path = "../fs-wiki-app", optional = true }

[dev-dependencies]
# Reads the picture of the window to count the rows of the page tree (already in the lock).
png = "0.18"

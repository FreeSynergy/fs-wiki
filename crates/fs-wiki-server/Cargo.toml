[package]
name = "fs-wiki-server"
description = "Cap'n Proto server of the FreeSynergy wiki: the contract texts.capnp over a Unix socket, in front of any Texts provider"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "fs_wiki_server"

[[bin]]
name = "fs-wiki-server"
path = "src/main.rs"

[dependencies]
fs-wiki-core = { path = "../fs-wiki-core" }
fs-text = { path = "../fs-text" }
fs-types = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.19", features = ["rpc"] }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.19", features = ["rpc"] }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
capnp = "0.27"
capnp-rpc = "0.27"
serde_json = "1"
uuid = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

# The hub (its client and its daemon) still builds only against the Unix transport of fs-interfaces v0.0.1: on Windows the
# wiki has the port without a hub (`hub_purge_absent.rs`) until the hub itself is ported.
[target.'cfg(unix)'.dependencies]
fs-hub-client = { git = "https://github.com/FreeSynergy/fs-hub", tag = "v0.0.1" }

[target.'cfg(unix)'.dev-dependencies]
fs-hub = { git = "https://github.com/FreeSynergy/fs-hub", tag = "v0.0.1" }

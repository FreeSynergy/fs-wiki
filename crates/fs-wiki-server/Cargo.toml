[package]
name = "fs-wiki-server"
description = "Cap'n Proto server of the FreeSynergy wiki: the contract texts.capnp over a Unix socket, in front of any Texts provider"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "fs_wiki_server"

[[bin]]
name = "fs-wiki-server"
path = "src/main.rs"

[dependencies]
fs-wiki-core = { path = "../fs-wiki-core" }
fs-text = { path = "../fs-text" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.34.0", features = ["rpc"] }
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.2.0" }
capnp = "0.27"
capnp-rpc = "0.27"
serde_json = "1"

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
uuid = "1"
tokio = { version = "1", features = ["full"] }

[package]
name = "fs-wiki-client"
description = "Client of the texts contract (texts.capnp): Texts and TextFeed of fs-wiki-core over a Unix socket"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fs-wiki-core = { path = "../fs-wiki-core" }
fs-text = { path = "../fs-text" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.45.0", features = ["rpc"] }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.5.0" }
capnp = "0.27"
capnp-rpc = "0.27"
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["rt", "sync", "net", "time"] }

[dev-dependencies]
fs-wiki-server = { path = "../fs-wiki-server" }
fs-wiki-testserver = { path = "../fs-wiki-testserver" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }

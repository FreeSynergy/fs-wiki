[package]
name = "fs-wiki-app"
description = "The wiki app of FreeSynergy, first visible part: reads, edits and exports the documentation in a window, on fs-components"
edition = "2024"
license.workspace = true
version.workspace = true

[dependencies]
fs-text = { path = "../fs-text" }
fs-wiki-core = { path = "../fs-wiki-core" }
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.2.0" }
fs-components-widgets = { git = "https://github.com/FreeSynergy/fs-components", rev = "eecc27eca0e818e3c986304fd9defad3f36911f0" }
fs-components-workbenches = { git = "https://github.com/FreeSynergy/fs-components", rev = "eecc27eca0e818e3c986304fd9defad3f36911f0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

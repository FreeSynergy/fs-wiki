[package]
name = "fs-wiki-app"
description = "The wiki app of FreeSynergy, first visible part: reads, edits and exports the documentation in a window, on fs-components"
edition = "2024"
license.workspace = true
version.workspace = true

[dependencies]
fs-text = { path = "../fs-text" }
fs-wiki-core = { path = "../fs-wiki-core" }
fs-wiki-client = { path = "../fs-wiki-client" }
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.2.0" }
fs-components-widgets = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.2.0" }
fs-components-workbenches = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.2.0" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
# The real server, started inside the tests; the app code itself uses no store.
fs-wiki-testserver = { path = "../fs-wiki-testserver" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }

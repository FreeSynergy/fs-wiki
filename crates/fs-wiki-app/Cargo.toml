[package]
name = "fs-wiki-app"
description = "The wiki app of FreeSynergy, first visible part: reads, edits and exports the documentation in a window, on fs-components"
edition = "2024"
license.workspace = true
version.workspace = true

[dependencies]
fs-text = { path = "../fs-text" }
fs-wiki-core = { path = "../fs-wiki-core" }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.5.0" }
fs-components-widgets = { git = "https://github.com/FreeSynergy/fs-components", rev = "0c18fe3958273e395402e7ae0019dc90dd491279" }
fs-components-workbenches = { git = "https://github.com/FreeSynergy/fs-components", rev = "0c18fe3958273e395402e7ae0019dc90dd491279" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

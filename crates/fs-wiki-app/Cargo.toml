[package]
name = "fs-wiki-app"
description = "The wiki app of FreeSynergy, first visible part: reads, edits and exports the documentation in a window, on fs-components"
edition = "2024"
license.workspace = true
version.workspace = true

[dependencies]
fs-text = { path = "../fs-text" }
fs-wiki-core = { path = "../fs-wiki-core" }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
fs-components-widgets = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.1" }
fs-components-workbenches = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

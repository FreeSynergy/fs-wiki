[package]
name = "fs-wiki-app"
description = "The wiki app of FreeSynergy, first visible part: reads, edits and exports the documentation in a window, on fs-components"
edition = "2024"
license.workspace = true
version.workspace = true

[dependencies]
fs-text = { path = "../fs-text" }
fs-wiki-core = { path = "../fs-wiki-core" }
fs-wiki-client = { path = "../fs-wiki-client" }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
# One revision of fs-components for everything (the Admin frontend is not tagged yet; a tag replaces the rev).
fs-components-widgets = { git = "https://github.com/FreeSynergy/fs-components", rev = "4688cee" }
fs-components-workbenches = { git = "https://github.com/FreeSynergy/fs-components", rev = "4688cee" }
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", rev = "4688cee" }
fs-components-fields = { git = "https://github.com/FreeSynergy/fs-components", rev = "4688cee" }
fs-components-styles = { git = "https://github.com/FreeSynergy/fs-components", rev = "4688cee" }
fs-admin-frontend = { git = "https://github.com/FreeSynergy/fs-components", rev = "4688cee" }
# The descriptions as the server sends them (v0.0.7) and as the frontend reads them (v0.0.2, see admin/convert.rs).
fs-types = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.7" }
fs-types-admin = { package = "fs-types", git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.2" }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
# The real server, started inside the tests; the app code itself uses no store.
fs-wiki-testserver = { path = "../fs-wiki-testserver" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }

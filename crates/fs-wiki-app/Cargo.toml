[package]
name = "fs-wiki-app"
description = "The wiki app of FreeSynergy, first visible part: reads, edits and exports the documentation in a window, on fs-components"
edition = "2024"
license.workspace = true
version.workspace = true

[features]
# The window writes what is typed into its fields to `FS_TEST_ACCESS_FILE` (fs-components `test-access`). ONLY for the
# typing test, in a debug build: fs-components refuses the feature in a release build, and no release manifest of ours
# turns it on.
test-access = ["fs-components-app/test-access"]

[dependencies]
fs-text = { path = "../fs-text" }
fs-wiki-core = { path = "../fs-wiki-core" }
fs-wiki-client = { path = "../fs-wiki-client" }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
# One tag of fs-components for everything; Blinc comes only through it (`fs_components::blinc`), never as a dependency here.
fs-components-widgets = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.17" }
fs-components-workbenches = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.17" }
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.17" }
fs-components-fields = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.17" }
fs-components-styles = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.17" }
fs-components = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.17" }
fs-components-primitives = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.17" }
fs-components-mf2 = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.17" }
fs-components-words = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.17" }
fs-admin-frontend = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.17" }
# The descriptions as the server sends them and as the frontend reads them: one fs-types, one source in the tree.
fs-types = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.19" }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
yaml_serde = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
cap-std = "3"
cap-fs-ext = "3"
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.19", features = ["rpc"] }

[target.'cfg(unix)'.dependencies]
# Owner and folder sync of the export, on the handle that cap-std gives (Unix only).
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
# The real server, started inside the tests; the app code itself uses no store.
fs-wiki-testserver = { path = "../fs-wiki-testserver" }
tempfile = "3"
# Reads the picture of the window to measure the editor (already in the lock through the drawing code).
png = "0.18"
tokio = { version = "1", features = ["full"] }
